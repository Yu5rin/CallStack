name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースに使うタグ名 (例: v0.2.0)。空欄なら package.json の version を使用'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $raw = $env:GITHUB_REF_NAME
          } else {
            $raw = $env:INPUT_TAG
            if ([string]::IsNullOrWhiteSpace($raw)) {
              $pkg = Get-Content package.json -Raw | ConvertFrom-Json
              $raw = "v$($pkg.version)"
            }
          }
          $clean = $raw.Trim()
          if ($clean -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            Write-Error "Invalid tag '$clean'. Expected vMAJOR.MINOR.PATCH (e.g. v0.2.3)."
            exit 1
          }
          echo "value=$clean" >> $env:GITHUB_OUTPUT
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Install dependencies
        run: npm ci

      - name: Build Windows ZIP
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate ZIP artifact
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Recurse -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "ZIP artifact not found under release/"
            exit 1
          }
          echo "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          echo "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      # リリース本文は「## 変更点」「## ダウンロード」と README への案内だけにする。
      # インストール方法や主な機能など版をまたいで変わらない説明は README に書く。
      # 自動更新（src/main/updates.ts）は本文を読まず、添付の名前と digest だけを使う。
      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $zip = Get-Item -LiteralPath $env:ZIP_PATH
          $inv = [System.Globalization.CultureInfo]::InvariantCulture
          if ($zip.Length -ge 1MB) {
            $size = [string]::Format($inv, '{0:F1} MB', $zip.Length / 1MB)
          } else {
            $size = [string]::Format($inv, '{0:F1} KB', $zip.Length / 1KB)
          }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
          $lines = @(
            '## 変更点'
            ''
            '- （この版の変更点を利用者向けの言葉で書き入れてから公開する）'
            ''
            '## ダウンロード'
            ''
            '| ファイル | サイズ | SHA256 |'
            '|---|---|---|'
            "| $($zip.Name) | $size | ``$sha`` |"
            ''
            'インストールと更新の方法は [README](https://github.com/Yu5rin/CallStack#インストール) をご覧ください。'
          )
          $path = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllLines($path, [string[]]$lines, (New-Object System.Text.UTF8Encoding $false))
          echo "path=$path" >> $env:GITHUB_OUTPUT
        env:
          ZIP_PATH: ${{ steps.locate.outputs.zip_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          # 下書きで作り、「変更点」を書き入れてから公開する（下書きは releases/latest に出ないので、
          # 公開するまで自動更新の対象にならない）。公開したあとは下書きのまま残さないこと。
          draft: true
          prerelease: false
          files: ${{ steps.locate.outputs.zip_path }}
          body_path: ${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
