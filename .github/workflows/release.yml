name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースに使うタグ名 (例: v0.2.0)。空欄なら package.json の version を使用'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $raw = $env:GITHUB_REF_NAME
          } else {
            $raw = $env:INPUT_TAG
            if ([string]::IsNullOrWhiteSpace($raw)) {
              $pkg = Get-Content package.json -Raw | ConvertFrom-Json
              $raw = "v$($pkg.version)"
            }
          }
          $clean = $raw.Trim()
          if ($clean -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            Write-Error "Invalid tag '$clean'. Expected vMAJOR.MINOR.PATCH (e.g. v0.2.3)."
            exit 1
          }
          echo "value=$clean" >> $env:GITHUB_OUTPUT
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Install dependencies
        run: npm ci

      - name: Build Windows ZIP
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate ZIP artifact
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Recurse -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "ZIP artifact not found under release/"
            exit 1
          }
          echo "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          echo "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teltimestack-windows-zip
          path: ${{ steps.locate.outputs.zip_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: CallStack ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.locate.outputs.zip_path }}
          body: |
            ## CallStack ${{ steps.tag.outputs.value }}

            ### インストール方法
            1. 下の Assets から `CallStack-*-win-x64.zip` をダウンロード
            2. ZIP を解凍
            3. `CallStack.exe` を実行（インストール不要）

            ### 主な機能
            - グローバルショートカットによる通話時間記録（Ctrl+Shift+S / E）
            - 会議の記録・録音・文字起こし（Ctrl+Shift+M で開始）
            - 録音ソースの自由な組み合わせ（マイク／システム音声、画面全体・ウィンドウ選択）
            - 録音の一時停止/再開（Ctrl+Shift+P）
            - マーカー（ブックマーク）打刻と議事録 (Markdown) エクスポート
            - 通話中 HUD（レベルメータ・マーカー・一時停止対応）・システムトレイ常駐
            - 統計ダッシュボード（日別・タグ別・連絡先別）
            - CSV エクスポート／インポート
            - 保留機能（Ctrl+Shift+H）
            - 録音（MP3）＋ whisper.cpp によるオフライン文字起こし（進捗表示・キャンセル・用語ヒント対応）
            - 録音 MP3・文字起こしテキストの保存（ダウンロード）

            ### whisper.cpp 文字起こしの準備
            `resources\whisper\README.txt` を参照してください。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
