name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースに使うタグ名 (例: v0.2.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows ZIP
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate ZIP artifact
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Recurse -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "ZIP artifact not found under release/"
            exit 1
          }
          echo "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          echo "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teltimestack-windows-zip
          path: ${{ steps.locate.outputs.zip_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TelTimeStack ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.locate.outputs.zip_path }}
          body: |
            ## TelTimeStack ${{ github.event.inputs.tag || github.ref_name }}

            ### インストール方法
            1. 下の Assets から `TelTimeStack-*-win-x64.zip` をダウンロード
            2. ZIP を解凍
            3. `TelTimeStack.exe` を実行（インストール不要）

            ### 主な機能
            - グローバルショートカットによる通話時間記録（Ctrl+Shift+S / E）
            - 通話中 HUD・システムトレイ常駐
            - 統計ダッシュボード（日別・タグ別・連絡先別）
            - CSV エクスポート／インポート
            - 保留機能（Ctrl+Shift+H）
            - マイク録音（MP3）＋ whisper.cpp によるオフライン文字起こし

            ### whisper.cpp 文字起こしの準備
            `resources\whisper\README.txt` を参照してください。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
